[project]
name = "cookmate-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [ "backend", "frontend", 
    "cohere>=6.1.0",
    "ipykernel>=7.2.0",
    "mlflow>=3.11.1",
    "openai>=2.32.0",
    "pandas>=2.3.3",

]

[tool.uv.sources]
cookmate-backend = { workspace = true }
cookmate-frontend = { workspace = true }

[tool.uv.workspace]
members = ["src/cookmate-frontend", "src/cookmate-backend"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookmate"]
